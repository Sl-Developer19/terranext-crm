name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Test · Rules · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Rules drift-check (C-1)
        # Verifies firestore.rules RBAC block is in sync with permissions.ts.
        # Fails fast if a developer changed permissions.ts without regenerating.
        run: npm run check:rules-drift

      - name: Build
        run: npm run build

  rules:
    name: Firestore rules emulator deny-tests (Doc 18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rules emulator tests
        run: npm run test:rules

  perf:
    name: Lighthouse (public shell) · Doc 11 §8
    runs-on: ubuntu-latest
    # Per-release cadence (Doc 11 §8), not every PR — Lighthouse timing is
    # too noisy on shared runners to gate merges; this job reports on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse CI (login, partner/login — the only unauthenticated routes)
        run: npm run perf:lighthouse

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 30
